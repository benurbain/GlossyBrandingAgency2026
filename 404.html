<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not Found • Glossy Branding Agency</title>
<meta name="robots" content="noindex">
<!-- A 404 can be served from any depth, so relative asset paths would break and
     root-absolute ones break under a GitHub Pages project subpath. Styles are
     inlined instead, which works everywhere. -->
<style>
  @font-face {
    font-family: "Rethink Sans";
    src: url("/assets/fonts/RethinkSans-var.ttf") format("truetype");
    font-weight: 400 800;
    font-display: swap;
  }
  :root { --ink: #111; --paper: #fff; --gray: #b3b3b3; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-content: center;
    gap: 1.5rem;
    padding: clamp(1.25rem, 6vw, 5.5rem);
    background: var(--paper);
    color: var(--ink);
    font-family: "Rethink Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 1rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    margin: 0;
    max-width: 18ch;
    font-size: clamp(2.5rem, 1.6rem + 4.3vw, 5rem);
    line-height: 1.08;
    letter-spacing: -0.02em;
  }
  p { margin: 0; max-width: 48ch; color: #333; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
  a.btn {
    display: inline-block;
    padding: 0.7em 1.4em;
    border: 1px solid var(--ink);
    border-radius: 100px;
    color: inherit;
    text-decoration: none;
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: background-color 320ms, color 320ms;
  }
  a.btn:hover, a.btn:focus-visible { background: var(--ink); color: var(--paper); }
  a.solid { background: var(--ink); color: var(--paper); }
  a.solid:hover, a.solid:focus-visible { background: #fffbe9; color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; } }
</style>
</head>
<body>

<main>
  <h1>This page took a branding detour.</h1>
  <p style="margin-top: 1.5rem;">The page you are looking for does not exist. Head back to the homepage or explore our work.</p>
  <div class="actions" style="margin-top: 2.5rem;">
    <a class="btn solid" href="/">Homepage</a>
    <a class="btn" href="/cases.html">Our cases</a>
  </div>
</main>

</body>
</html>
