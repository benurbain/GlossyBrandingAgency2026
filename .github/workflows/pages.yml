name: Publish validated Glossy website
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: glossy-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Validate SEO and stage public files only
        run: python3 scripts/package-public.py --output "$RUNNER_TEMP/glossy-public"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/glossy-public
      - name: Publish to glossy.tv
        id: deployment
        uses: actions/deploy-pages@v4
